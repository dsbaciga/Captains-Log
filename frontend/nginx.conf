# ==========================================================================
# TLS / HTTPS Notice
# ==========================================================================
# This nginx instance listens on plain HTTP (port 80) and expects a
# TLS-terminating reverse proxy upstream to handle HTTPS. Examples:
#   - Traefik (with automatic Let's Encrypt certificates)
#   - Caddy (with automatic HTTPS)
#   - nginx-proxy-manager
#   - Cloudflare Tunnel
#
# Do NOT add ssl_certificate / ssl_certificate_key directives here.
# TLS termination is the responsibility of the upstream reverse proxy.
#
# The Strict-Transport-Security (HSTS) header below instructs browsers
# to always use HTTPS for future requests, even if the user types http://.
# This is safe to include even behind a reverse proxy.
# ==========================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Increase max body size for backup restore (default is 1MB)
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The service worker, its registration shim and the app shell must NEVER be
    # cached immutably. They have stable filenames (no content hash), so a long
    # cache pins clients to whatever build they first loaded and no amount of
    # reloading picks up a new deploy. Exact-match (=) locations are chosen
    # before the regex block below, so these win regardless of ordering.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /registerSW.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /manifest.webmanifest {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Cache static assets. Safe to keep immutable: Vite content-hashes these
    # filenames, so a new build produces new names.
    # Note: add_header in a location block drops all parent server-level headers,
    # so security headers must be repeated here.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Proxy API requests to the backend service
    # `^~` stops nginx from evaluating the regex location above: a plain prefix
    # location loses to a matching regex, which would send every proxied path
    # ending in .js/.jpg/.png/... to the local filesystem instead of the backend.
    location ^~ /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 100M;
    }

    # Proxy upload file access to the backend
    # `^~` is required, not cosmetic: uploaded files are stored as .jpg (cover
    # images are always re-encoded to JPEG), so without it the regex location
    # above wins and every uploaded image 404s from the SPA root as a broken image.
    location ^~ /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve index.html for all routes (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
